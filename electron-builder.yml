appId: com.taskjian.app
productName: TaskJian
copyright: Copyright © 2026 TaskJian
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - packages/main/dist/**/*
  - packages/preload/dist/**/*
  - packages/renderer/dist-renderer/**/*
  - node_modules/**/*
  - '!**/.map'
asar: false
extraResources:
  - from: packages/shared/dist
    to: app/node_modules/@taskjian/shared
win:
  target:
    - nsis
  icon: build/icon.ico
  sign: scripts/no-sign.js
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Office
