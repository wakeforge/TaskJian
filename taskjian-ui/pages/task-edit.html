<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务编辑弹窗</title>
    <style id="theme-vars">
/* TaskJian Design Tokens */

:root {
  /* Base scale */
  --taskjian-bg: #f8f9fb;
  --taskjian-surface: #ffffff;
  --taskjian-surface-2: #f1f3f5;
  --taskjian-surface-3: #e5e7eb;

  --taskjian-ink: #1f2937;
  --taskjian-ink-2: #6b7280;
  --taskjian-ink-3: #9ca3af;

  --taskjian-line: #e5e7eb;
  --taskjian-line-strong: #d1d5db;

  /* Brand primary: indigo */
  --taskjian-primary: #4f46e5;
  --taskjian-primary-600: #4338ca;
  --taskjian-primary-50: #eef2ff;
  --taskjian-primary-foreground: #ffffff;

  /* Semantic aliases for head contract */
  --taskjian-background: var(--taskjian-bg);
  --taskjian-foreground: var(--taskjian-ink);
  --taskjian-card: var(--taskjian-surface);
  --taskjian-card-foreground: var(--taskjian-ink);
  --taskjian-popover: var(--taskjian-surface);
  --taskjian-popover-foreground: var(--taskjian-ink);
  --taskjian-muted: var(--taskjian-surface-2);
  --taskjian-muted-foreground: var(--taskjian-ink-2);
  --taskjian-border: var(--taskjian-line);
  --taskjian-input: var(--taskjian-line);
  --taskjian-ring: var(--taskjian-primary);

  /* Radius */
  --taskjian-radius-small: 4px;
  --taskjian-radius-medium: 8px;
  --taskjian-radius-large: 12px;

  /* State colors */
  --taskjian-state-success: #30a46c;
  --taskjian-state-warning: #f59e0b;
  --taskjian-state-error: #ef4444;
  --taskjian-state-info: #3b82f6;

  /* Status-specific */
  --taskjian-status-todo: #6b7280;
  --taskjian-status-progress: #3b82f6;
  --taskjian-status-blocked: #f59e0b;
  --taskjian-status-done: #30a46c;

  /* Shadows */
  --taskjian-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --taskjian-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
  --taskjian-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);

  /* Typography */
  --taskjian-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --taskjian-font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;
}

/* Dark mode (optional baseline) */
html.dark {
  --taskjian-bg: #0b0b0f;
  --taskjian-surface: #14141a;
  --taskjian-surface-2: #1c1c24;
  --taskjian-surface-3: #272730;
  --taskjian-ink: #f3f4f6;
  --taskjian-ink-2: #a1a1aa;
  --taskjian-ink-3: #71717a;
  --taskjian-line: #272730;
  --taskjian-line-strong: #3f3f4a;
  --taskjian-primary: #6366f1;
  --taskjian-primary-600: #818cf8;
  --taskjian-primary-50: #1e1b4b;
  --taskjian-primary-foreground: #ffffff;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--taskjian-background);
    --color-foreground: var(--taskjian-foreground);
    --color-card: var(--taskjian-card);
    --color-card-foreground: var(--taskjian-card-foreground);
    --color-popover: var(--taskjian-popover);
    --color-popover-foreground: var(--taskjian-popover-foreground);
    --color-primary: var(--taskjian-primary);
    --color-primary-foreground: var(--taskjian-primary-foreground);
    --color-muted: var(--taskjian-muted);
    --color-muted-foreground: var(--taskjian-muted-foreground);
    --color-border: var(--taskjian-border);
    --color-input: var(--taskjian-input);
    --color-ring: var(--taskjian-ring);
    --radius-sm: var(--taskjian-radius-small);
    --radius-md: var(--taskjian-radius-medium);
    --radius-lg: var(--taskjian-radius-large);
  }
  @layer base {
    body { background: var(--taskjian-background); color: var(--taskjian-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-background { color: var(--taskjian-background); }
      .border-background { border-color: var(--taskjian-background); }
      .ring-background { --tw-ring-color: var(--taskjian-background); }
      .bg-foreground { background-color: var(--taskjian-foreground); }
      .text-foreground { color: var(--taskjian-foreground); }
      .border-foreground { border-color: var(--taskjian-foreground); }
      .ring-foreground { --tw-ring-color: var(--taskjian-foreground); }

      .text-card { color: var(--taskjian-card); }
      .border-card { border-color: var(--taskjian-card); }
      .ring-card { --tw-ring-color: var(--taskjian-card); }
      .bg-card-foreground { background-color: var(--taskjian-card-foreground); }
      .text-card-foreground { color: var(--taskjian-card-foreground); }
      .border-card-foreground { border-color: var(--taskjian-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--taskjian-card-foreground); }
      .bg-popover { background-color: var(--taskjian-popover); }
      .text-popover { color: var(--taskjian-popover); }
      .border-popover { border-color: var(--taskjian-popover); }
      .ring-popover { --tw-ring-color: var(--taskjian-popover); }
      .bg-popover-foreground { background-color: var(--taskjian-popover-foreground); }
      .text-popover-foreground { color: var(--taskjian-popover-foreground); }
      .border-popover-foreground { border-color: var(--taskjian-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--taskjian-popover-foreground); }
      .bg-primary { background-color: var(--taskjian-primary); }
      .text-primary { color: var(--taskjian-primary); }
      .border-primary { border-color: var(--taskjian-primary); }
      .ring-primary { --tw-ring-color: var(--taskjian-primary); }
      .bg-primary-foreground { background-color: var(--taskjian-primary-foreground); }
      .text-primary-foreground { color: var(--taskjian-primary-foreground); }
      .border-primary-foreground { border-color: var(--taskjian-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--taskjian-primary-foreground); }
      .bg-muted { background-color: var(--taskjian-muted); }
      .text-muted { color: var(--taskjian-muted); }
      .border-muted { border-color: var(--taskjian-muted); }
      .ring-muted { --tw-ring-color: var(--taskjian-muted); }
      .bg-muted-foreground { background-color: var(--taskjian-muted-foreground); }
      .text-muted-foreground { color: var(--taskjian-muted-foreground); }
      .border-muted-foreground { border-color: var(--taskjian-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--taskjian-muted-foreground); }
      .bg-border { background-color: var(--taskjian-border); }
      .text-border { color: var(--taskjian-border); }
      .border-border { border-color: var(--taskjian-border); }
      .ring-border { --tw-ring-color: var(--taskjian-border); }
      .bg-input { background-color: var(--taskjian-input); }
      .text-input { color: var(--taskjian-input); }
      .border-input { border-color: var(--taskjian-input); }
      .ring-input { --tw-ring-color: var(--taskjian-input); }
      .bg-ring { background-color: var(--taskjian-ring); }
      .text-ring { color: var(--taskjian-ring); }
      .border-ring { border-color: var(--taskjian-ring); }
      .ring-ring { --tw-ring-color: var(--taskjian-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="h-screen antialiased" style="font-family: var(--taskjian-font-sans); overflow: hidden;">
  <div id="app" class="h-screen flex flex-col bg-background text-foreground" data-viewport-mode="app-shell">
    <!-- Title bar -->
    <header class="h-9 flex items-center justify-between px-3 border-b border-border bg-card shrink-0 select-none" data-dom-id="app-title-bar">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5">
          <i data-lucide="check-square" class="w-4 h-4 text-primary"></i>
          <span class="text-sm font-semibold text-foreground tracking-tight">任笺 TaskJian</span>
        </div>
        <span class="text-xs text-muted-foreground">|</span>
        <span class="text-sm font-medium text-foreground">科技部工作</span>
      </div>
      <div class="flex items-center">
        <button type="button" aria-label="最小化" class="flex items-center justify-center w-8 h-9 rounded-sm text-muted-foreground hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <button type="button" aria-label="最大化" class="flex items-center justify-center w-8 h-9 rounded-sm text-muted-foreground hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
          <i data-lucide="square" class="w-3 h-3"></i>
        </button>
        <button type="button" aria-label="关闭" class="flex items-center justify-center w-8 h-9 rounded-sm text-muted-foreground hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </header>

    <div class="shell-row flex flex-1 overflow-hidden">
      <!-- Sidebar -->
      <aside class="sidebar w-[220px] flex-shrink-0 border-r border-border bg-card flex flex-col overflow-y-auto p-3 gap-3 select-none">
        <section>
          <h2 class="px-2 mb-1.5 text-[11px] font-semibold text-muted-foreground uppercase tracking-wider">任务导航</h2>
          <nav class="space-y-0.5">
            <button type="button" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-muted-foreground"></i>
              <span class="flex-1 text-left">分布式核心</span>
              <span class="text-xs text-muted-foreground tabular-nums">7</span>
            </button>
            <button type="button" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-sm font-medium text-foreground bg-muted transition-colors">
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-muted-foreground"></i>
              <span class="flex-1 text-left">国库支付</span>
              <span class="text-xs text-muted-foreground tabular-nums">6</span>
            </button>
            <button type="button" class="w-full flex items-center gap-2 pl-8 pr-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
              <span class="text-left">国库支付 - 中间业务</span>
            </button>
            <button type="button" class="w-full flex items-center gap-2 pl-8 pr-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
              <span class="text-left">信创版本测试</span>
            </button>
            <button type="button" class="w-full flex items-center gap-2 pl-8 pr-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
              <span class="text-left">开始上云整理流程</span>
            </button>
            <button type="button" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-muted-foreground"></i>
              <span class="flex-1 text-left">国库单位资金</span>
              <span class="text-xs text-muted-foreground tabular-nums">3</span>
            </button>
          </nav>
        </section>

        <hr class="border-border">

        <section>
          <div class="flex items-center justify-between px-2 mb-1.5">
            <h2 class="text-[11px] font-semibold text-muted-foreground uppercase tracking-wider">工作区</h2>
            <button data-dom-id="btn-workspace-add" type="button" aria-label="添加工作区" class="flex items-center justify-center w-5 h-5 rounded-md text-muted-foreground hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <nav class="space-y-0.5">
            <button data-dom-id="nav-workspace-keji" type="button" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-sm font-medium bg-primary/10 text-primary transition-colors">
              <span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
              <span class="flex-1 text-left">科技部工作</span>
            </button>
            <button data-dom-id="nav-workspace-caiwu" type="button" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
              <span class="w-1.5 h-1.5 rounded-full bg-muted-foreground"></span>
              <span class="flex-1 text-left">财务部工作</span>
            </button>
            <button data-dom-id="nav-workspace-personal" type="button" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
              <span class="w-1.5 h-1.5 rounded-full bg-muted-foreground"></span>
              <span class="flex-1 text-left">个人事务</span>
            </button>
          </nav>
        </section>

        <hr class="border-border">

        <button data-dom-id="btn-archive" type="button" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-sm text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
          <i data-lucide="archive" class="w-4 h-4 text-muted-foreground"></i>
          <span class="flex-1 text-left">归档</span>
        </button>
      </aside>

      <!-- Main content -->
      <main class="content flex-1 flex flex-col min-w-0 overflow-hidden bg-background">
        <!-- Filter bar -->
        <div class="flex items-center gap-2 px-4 py-2 border-b border-border bg-card/50 shrink-0">
          <button data-dom-id="btn-tag-filter" type="button" class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-xs font-medium border border-border bg-card text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
            <i data-lucide="tag" class="w-3 h-3 text-muted-foreground"></i>
            标签
          </button>
          <button data-dom-id="btn-status-filter" type="button" class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-xs font-medium border border-border bg-card text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
            <i data-lucide="filter" class="w-3 h-3 text-muted-foreground"></i>
            状态
          </button>
          <span class="text-xs text-muted-foreground whitespace-nowrap">当前过滤：</span>
          <div class="flex items-center gap-2 flex-1 flex-wrap min-w-0">
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs border border-border bg-card text-foreground">
              【国库支付】
              <button type="button" aria-label="移除" class="inline-flex items-center justify-center rounded-full hover:bg-muted p-0.5 text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
                <i data-lucide="x" class="w-3 h-3"></i>
              </button>
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs border border-border bg-card text-foreground">
              [T0]
              <button type="button" aria-label="移除" class="inline-flex items-center justify-center rounded-full hover:bg-muted p-0.5 text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
                <i data-lucide="x" class="w-3 h-3"></i>
              </button>
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs border border-border bg-card text-foreground">
              [待办]
              <button type="button" aria-label="移除" class="inline-flex items-center justify-center rounded-full hover:bg-muted p-0.5 text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">
                <i data-lucide="x" class="w-3 h-3"></i>
              </button>
            </span>
          </div>
          <button data-dom-id="btn-tag-management" type="button" class="text-xs text-muted-foreground hover:text-foreground px-2 py-1 rounded-md hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">管理标签</button>
          <button type="button" class="text-xs text-muted-foreground hover:text-foreground px-2 py-1 rounded-md hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors">清除全部</button>
          <button data-dom-id="btn-task-add" type="button" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md bg-primary text-primary-foreground text-xs font-medium hover:opacity-90 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            新建
          </button>
        </div>

        <!-- Task tree -->
        <div class="content-scroll flex-1 overflow-y-auto p-4 space-y-4">
          <h1 class="text-lg font-semibold text-foreground tracking-tight">【国库支付】</h1>

          <div class="space-y-1">
            <!-- Task 1 -->
            <div class="rounded-md hover:bg-card transition-colors">
              <div class="flex items-start gap-2 px-2 py-1.5">
                <span class="mt-1.5 inline-flex" style="color: var(--taskjian-status-progress);">
                  <svg viewBox="0 0 16 16" class="w-2 h-2" fill="currentColor"><circle cx="8" cy="8" r="7" opacity="0.25"/><path d="M8 1a7 7 0 0 1 0 14V1Z"/></svg>
                </span>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium text-white shrink-0" style="background-color: #8e4ec6;">S2</span>
                <span class="text-xs text-muted-foreground shrink-0 pt-0.5" style="font-family: var(--taskjian-font-mono);">101</span>
                <span class="text-sm text-foreground break-words">国库支付 - 中间业务</span>
              </div>
              <div class="flex items-start gap-2 pl-8 pr-2 py-1">
                <span class="text-xs text-muted-foreground" style="font-family: var(--taskjian-font-mono);">└─</span>
                <span class="text-xs text-muted-foreground break-words">原始请求为每个字 …</span>
              </div>
            </div>

            <!-- Task 2 -->
            <div class="rounded-md hover:bg-card transition-colors">
              <div class="flex items-start gap-2 px-2 py-1.5">
                <span class="mt-1.5 inline-flex" style="color: var(--taskjian-status-todo);">
                  <svg viewBox="0 0 16 16" class="w-2 h-2" fill="currentColor"><circle cx="8" cy="8" r="7"/></svg>
                </span>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium text-white shrink-0" style="background-color: #3e63dd;">T1</span>
                <span class="text-sm text-foreground break-words">信创版本测试（联系南 …</span>
              </div>
              <div class="flex items-start gap-2 pl-8 pr-2 py-1">
                <span class="text-xs text-muted-foreground" style="font-family: var(--taskjian-font-mono);">└─</span>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium text-white shrink-0" style="background-color: #30a46c;">ED</span>
                <span class="text-xs text-foreground break-words">其他流水凭证</span>
              </div>
            </div>

            <!-- Task 3 -->
            <div class="rounded-md hover:bg-card transition-colors">
              <div class="flex items-start gap-2 px-2 py-1.5">
                <span class="mt-1.5 inline-flex" style="color: var(--taskjian-status-todo);">
                  <svg viewBox="0 0 16 16" class="w-2 h-2" fill="currentColor"><circle cx="8" cy="8" r="7"/></svg>
                </span>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium text-white shrink-0" style="background-color: #3e63dd;">T1</span>
                <span class="text-sm text-foreground break-words">开始上云整理流程</span>
              </div>
              <div class="pl-8 pr-2 space-y-1">
                <div class="flex items-start gap-2 py-1">
                  <span class="text-xs text-muted-foreground" style="font-family: var(--taskjian-font-mono);">├─</span>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium text-white shrink-0" style="background-color: #30a46c;">ED</span>
                  <span class="text-xs text-foreground break-words">测试云 V+ 测试报告</span>
                </div>
                <div class="flex items-start gap-2 py-1">
                  <span class="text-xs text-muted-foreground" style="font-family: var(--taskjian-font-mono);">├─</span>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium text-white shrink-0" style="background-color: #30a46c;">ED</span>
                  <span class="text-xs text-foreground break-words">(已经开展) 渗透测试</span>
                </div>
                <div class="flex items-start gap-2 py-1">
                  <span class="text-xs text-muted-foreground" style="font-family: var(--taskjian-font-mono);">├─</span>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium text-white shrink-0" style="background-color: #30a46c;">ED</span>
                  <span class="text-xs text-foreground break-words">云服务创建 +redis</span>
                </div>
                <div class="flex items-start gap-2 py-1">
                  <span class="text-xs text-muted-foreground" style="font-family: var(--taskjian-font-mono);">└─</span>
                  <span class="mt-0.5 inline-flex" style="color: var(--taskjian-status-todo);">
                    <svg viewBox="0 0 16 16" class="w-2 h-2" fill="currentColor"><circle cx="8" cy="8" r="7"/></svg>
                  </span>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium text-white shrink-0" style="background-color: #3e63dd;">T0</span>
                  <span class="text-xs text-foreground break-words">环境配置，下发申请</span>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- Status bar -->
        <footer class="status-bar h-8 flex items-center justify-between px-3 border-t border-border bg-card shrink-0 text-xs text-muted-foreground">
          <span class="tabular-nums">共 12 项 · 待办 5 · 进行中 2 · 受阻 1 · 已完成 3</span>
          <span>快速添加: Ctrl+Enter</span>
          <span>v1.0.0</span>
        </footer>
      </main>
    </div>

    <!-- Overlay: task edit modal -->
    <div id="overlay-layer" class="overlay-layer" data-dom-id="modal-task-edit-backdrop" role="presentation" aria-hidden="false">
      <div class="modal-dialog" data-dom-id="modal-task-edit" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title">新建任务</h2>
          <button type="button" class="modal-close" aria-label="关闭" onclick="closeTaskEditModal()">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <form class="modal-body overflow-y-auto" id="task-edit-form" onsubmit="return false;" data-scroll-region="primary">
          <div class="field-group">
            <label for="input-task-content" class="field-label">任务内容</label>
            <textarea id="input-task-content" data-dom-id="input-task-content" class="task-textarea" rows="4" placeholder="输入任务内容..."></textarea>
          </div>

          <div class="field-group">
            <label for="select-task-status" class="field-label">状态</label>
            <select id="select-task-status" data-dom-id="select-task-status" class="task-select">
              <option value="todo">待办</option>
              <option value="in-progress">进行中</option>
              <option value="blocked">受阻</option>
              <option value="done">已完成</option>
            </select>
          </div>

          <div class="field-group">
            <span class="field-label" id="tags-label">标签</span>
            <div class="tag-chips" data-dom-id="select-task-tags" role="group" aria-labelledby="tags-label">
              <button type="button" class="tag-chip" data-tag="P0" aria-pressed="false" style="background-color: #e5484d;">P0</button>
              <button type="button" class="tag-chip" data-tag="P1" aria-pressed="false" style="background-color: #f76b15;">P1</button>
              <button type="button" class="tag-chip" data-tag="S1" aria-pressed="false" style="background-color: #8e4ec6;">S1</button>
              <button type="button" class="tag-chip" data-tag="S2" aria-pressed="false" style="background-color: #9d3bb0;">S2</button>
              <button type="button" class="tag-chip" data-tag="T0" aria-pressed="false" style="background-color: #3e63dd;">T0</button>
              <button type="button" class="tag-chip" data-tag="ED" aria-pressed="false" style="background-color: #30a46c;">ED</button>
            </div>
          </div>
        </form>

        <div class="modal-footer">
          <button type="button" data-dom-id="btn-cancel-task" class="btn-secondary" onclick="closeTaskEditModal()">取消</button>
          <button type="button" data-dom-id="btn-save-task" class="btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <style id="critical-layout">
    #app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #app > header { flex: 0 0 auto; }
    .shell-row { flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden; }
    .sidebar { width: 220px; flex: 0 0 auto; overflow-y: auto; }
    .content { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .content-scroll { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
    .status-bar { flex: 0 0 auto; }
    .overlay-layer { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background-color: rgba(15, 23, 42, 0.40); }
    .modal-dialog { width: min(480px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; background-color: var(--taskjian-surface); border-radius: var(--taskjian-radius-large); box-shadow: var(--taskjian-shadow-3); display: flex; flex-direction: column; }
    .modal-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 0; }
    .modal-body { flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer { flex: 0 0 auto; display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 16px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <style>
    .modal-title { margin: 0; font-size: 16px; font-weight: 600; color: var(--taskjian-ink); line-height: 1.3; }
    .modal-close { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--taskjian-radius-medium); color: var(--taskjian-ink-2); background: transparent; border: none; cursor: pointer; }
    .modal-close:hover { background-color: var(--taskjian-surface-2); color: var(--taskjian-ink); }
    .modal-close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--taskjian-ring); }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 13px; font-weight: 500; color: var(--taskjian-ink); }
    .task-textarea { width: 100%; resize: vertical; min-height: 80px; padding: 10px 12px; border: 1px solid var(--taskjian-input); border-radius: var(--taskjian-radius-medium); background-color: var(--taskjian-surface); color: var(--taskjian-ink); font-family: inherit; font-size: 14px; line-height: 1.5; }
    .task-textarea::placeholder { color: var(--taskjian-ink-3); }
    .task-textarea:focus { outline: none; border-color: var(--taskjian-ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--taskjian-ring) 20%, transparent); }
    .task-select { width: 100%; padding: 8px 12px; border: 1px solid var(--taskjian-input); border-radius: var(--taskjian-radius-medium); background-color: var(--taskjian-surface); color: var(--taskjian-ink); font-family: inherit; font-size: 14px; }
    .task-select:focus { outline: none; border-color: var(--taskjian-ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--taskjian-ring) 20%, transparent); }
    .tag-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; padding: 4px 10px; border-radius: var(--taskjian-radius-small); font-size: 12px; font-weight: 500; color: #ffffff; border: 2px solid transparent; cursor: pointer; transition: transform 120ms ease, box-shadow 120ms ease; }
    .tag-chip:hover { transform: translateY(-1px); }
    .tag-chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--taskjian-ink); border-color: var(--taskjian-surface); }
    .btn-secondary { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border-radius: var(--taskjian-radius-medium); font-size: 13px; font-weight: 500; color: var(--taskjian-ink); background-color: var(--taskjian-surface-2); border: 1px solid var(--taskjian-border); cursor: pointer; }
    .btn-secondary:hover { background-color: var(--taskjian-surface-3); }
    .btn-secondary:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--taskjian-ring); }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border-radius: var(--taskjian-radius-medium); font-size: 13px; font-weight: 500; color: var(--taskjian-primary-foreground); background-color: var(--taskjian-primary); border: 1px solid var(--taskjian-primary); cursor: pointer; }
    .btn-primary:hover { background-color: var(--taskjian-primary-600); }
    .btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--taskjian-ring) 30%, transparent); }
  </style>
  <script>
    lucide.createIcons();

    function closeTaskEditModal() {
      var overlay = document.getElementById('overlay-layer');
      if (overlay) overlay.style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', function () {
      var backdrop = document.querySelector('[data-dom-id="modal-task-edit-backdrop"]');
      var dialog = document.querySelector('[data-dom-id="modal-task-edit"]');
      if (backdrop && dialog) {
        backdrop.addEventListener('click', function (event) {
          if (event.target === backdrop) closeTaskEditModal();
        });
        dialog.addEventListener('click', function (event) { event.stopPropagation(); });
      }

      var chips = document.querySelectorAll('[data-dom-id="select-task-tags"] .tag-chip');
      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          var pressed = chip.getAttribute('aria-pressed') === 'true';
          chip.setAttribute('aria-pressed', String(!pressed));
        });
      });
    });
  </script>
</body>
</html>
